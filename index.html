<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMS Bluetooth Monitor</title>
  <script src="/plotly.min.js"></script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #181b24;
      --border: #2a2f3d;
      --text: #e6edf3;
      --muted: #8b949e;
      --cyan: #00e5ff;
      --yellow: #ffd54f;
      --red: #ff5252;
      --green: #69f0ae;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    h1 { font-size: 1.25rem; color: var(--cyan); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    button:hover { border-color: var(--cyan); color: var(--cyan); }
    button.active { background: #00e5ff22; border-color: var(--cyan); color: var(--cyan); }
    select {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
    }
    select:focus { outline: 1px solid var(--cyan); }
    .badge { font-size: 0.8rem; color: var(--muted); background: var(--card); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .kpi-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .kpi-val { font-size: 1.3rem; font-weight: 700; }
    .chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="pageTitle">BMS Bluetooth &mdash; Web Monitor</h1>
      <div id="lastUpdate" style="font-size:0.8rem; color:var(--muted);">Connecting to dashboard...</div>
    </div>
    <div class="controls">
      <button onclick="setQuickRange(6)" id="btn-6">6 hours</button>
      <button onclick="setQuickRange(24)" id="btn-24">24 hours</button>
      <button onclick="setQuickRange(168)" id="btn-168">7 days</button>
      <button onclick="setQuickRange(720)" id="btn-720">30 days</button>
      <button onclick="setQuickRange(0)" id="btn-0" class="active">All</button>
      <span class="badge" id="resBadge">Resolution: -</span>
      <select id="languageSelect" aria-label="Language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="ru">Русский</option>
        <option value="zh-CN">简体中文</option>
      </select>
    </div>
  </header>

  <div class="kpis">
    <div class="kpi"><div class="kpi-label" id="labelStatus">Status</div><div class="kpi-val" id="kStatus">-</div></div>
    <div class="kpi"><div class="kpi-label" id="labelSoc">State of charge (SOC)</div><div class="kpi-val" style="color:var(--cyan)" id="kSoc">-</div></div>
    <div class="kpi"><div class="kpi-label" id="labelVoltage">Voltage</div><div class="kpi-val" style="color:var(--yellow)" id="kVolt">-</div></div>
    <div class="kpi"><div class="kpi-label" id="labelPower">Current / power</div><div class="kpi-val" style="color:var(--red)" id="kPower">-</div></div>
    <div class="kpi"><div class="kpi-label" id="labelDrift">Cell drift</div><div class="kpi-val" style="color:var(--green)" id="kDrift">-</div></div>
    <div class="kpi"><div class="kpi-label" id="labelEta">Temperature / ETA</div><div class="kpi-val" id="kEta">-</div></div>
  </div>

  <div class="chart-box"><div id="chartCap" style="height:210px;"></div></div>
  <div class="chart-box"><div id="chartVolt" style="height:210px;"></div></div>
  <div class="chart-box"><div id="chartPower" style="height:210px;"></div></div>
  <div class="chart-box"><div id="chartCells" style="height:230px;"></div></div>

  <script>
    let customStart = null;
    let customEnd = null;
    let initialized = false;
    let currentLanguage = "en";

    const translations = {

        soc: "State of charge (SOC)",
        voltage: "Voltage",

        range6: "6 Std.",

        range30Days: "30 Tage",

        resolutionLabel: "Auflösung: {value}",
        resolutionOriginal: "1 Min. (Original)",
        resolutionDay: "15 Min. (Tagesansicht)",
        resolutionWeek: "1 Std. (Wochenansicht)",
        resolutionMonth: "6 Std. (Monatsansicht)",
        resolutionYear: "1 Tag (Jahresansicht)",
        resolutionUnknown: "-",

        soc: "Ladezustand (SOC)",
        voltage: "Spannung",
        power: "Strom / Leistung",
        drift: "Zelldrift",

        remainingCapacity: "Restkapazität (Ah)",

        language: "Idioma",

        lastMeasurement: "Última medición: {time} (actualización cada 10 s)",
        noData: "No se encontraron datos de medición.",

      },
      ru: {

        resolutionOriginal: "1 мин (исходные данные)",

        resolutionUnknown: "-",

        voltage: "Напряжение",

        drift: "Разброс напряжения ячеек",
        eta: "Температура / время",
        remainingCapacity: "Оставшаяся ёмкость (А·ч)",

        totalVoltage: "Общее напряжение (В)",
        voltageAxis: "Напряжение (В)",
        powerSeries: "Мощность (Вт)",

        cellVoltage: "Напряжение ячеек (В)",
        cell: "Ячейка",
        charging: "Заряд",
        discharging: "Разряд",
        idle: "Покой",
        remainingEta: "Осталось ~{hours} ч",
        fullEta: "До полного заряда ~{hours} ч"
      },
      "zh-CN": {
        documentTitle: "BMS 蓝牙监控",
        pageTitle: "BMS 蓝牙 — 网页监控",
        language: "语言",
        connecting: "正在连接仪表板...",
        lastMeasurement: "最近测量：{time}（每 10 秒刷新）",
        noData: "未找到测量数据。",
        range6: "6 小时",
        range24: "24 小时",
        range7Days: "7 天",
        range30Days: "30 天",
        rangeAll: "全部",
        resolutionLabel: "分辨率：{value}",
        resolutionOriginal: "1 分钟（原始数据）",
        resolutionDay: "15 分钟（按天）",
        resolutionWeek: "1 小时（按周）",
        resolutionMonth: "6 小时（按月）",
        resolutionYear: "1 天（按年）",
        resolutionUnknown: "-",
        status: "状态",
        soc: "电量状态（SOC）",
        voltage: "电压",
        power: "电流 / 功率",
        drift: "电芯压差",
        eta: "温度 / 预计时间",
        remainingCapacity: "剩余容量（Ah）",
        capacityAxis: "容量（Ah）",
        totalVoltage: "总电压（V）",
        voltageAxis: "电压（V）",
        powerSeries: "功率（W）",
        powerAxis: "功率（W）",
        cellVoltage: "电芯电压（V）",
        cell: "电芯",
        charging: "充电中",
        discharging: "放电中",
        idle: "静置",
        remainingEta: "剩余约 {hours} 小时",
        fullEta: "约 {hours} 小时后充满"
      }
    };

    const languageLocales = {
      en: "en-US",
      de: "de-DE",
      es: "es-ES",
      ru: "ru-RU",
      "zh-CN": "zh-CN"
    };

    const languageSelect = document.getElementById("languageSelect");

    function translate(key) {
      return translations[currentLanguage][key] || translations.en[key];
    }

    function applyLanguage(language) {
      if (!Object.prototype.hasOwnProperty.call(translations, language)) {
        throw new Error(`Unsupported dashboard language: ${language}`);
      }
      currentLanguage = language;
      document.documentElement.lang = language;
      document.title = translate("documentTitle");

      const labels = {
        pageTitle: "pageTitle",
        "btn-6": "range6",
        "btn-24": "range24",
        "btn-168": "range7Days",
        "btn-720": "range30Days",
        "btn-0": "rangeAll",
        labelStatus: "status",
        labelSoc: "soc",
        labelVoltage: "voltage",
        labelPower: "power",
        labelDrift: "drift",
        labelEta: "eta"
      };
      Object.entries(labels).forEach(([id, key]) => {
        document.getElementById(id).textContent = translate(key);
      });
      languageSelect.setAttribute("aria-label", translate("language"));
      document.getElementById("lastUpdate").textContent = translate("connecting");
      document.getElementById("resBadge").textContent =
        translate("resolutionLabel").replace("{value}", translate("resolutionUnknown"));
    }

    function formatTimestamp(value) {
      const match = /^(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2}):(\d{2})$/.exec(value);
      if (!match) return value;
      const [, day, month, year, hour, minute, second] = match;
      const date = new Date(Date.UTC(year, month - 1, day, hour, minute, second));
      return new Intl.DateTimeFormat(languageLocales[currentLanguage], {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23",
        timeZone: "UTC"
      }).format(date);
    }

    function translateStatus(status) {
      const statusKeys = {
        LAEDT: "charging",
        ENTLAEDT: "discharging",
        RUHE: "idle"
      };
      return statusKeys[status] ? translate(statusKeys[status]) : status;
    }

    const baseLayout = (yTitle) => ({
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "rgba(0,0,0,0)",
      font: { color: "#e6edf3", size: 11 },
      margin: { l: 55, r: 20, t: 12, b: 30 },
      xaxis: { gridcolor: "#2a2f3d", zeroline: false },
      yaxis: { title: yTitle, gridcolor: "#2a2f3d", zeroline: false },
      hovermode: "x unified",
      legend: { orientation: "h", y: 1.15, x: 0 }
    });

    const plotConfig = { responsive: true, scrollZoom: true, displaylogo: false };

    function setQuickRange(hours) {
      document.querySelectorAll(".controls button").forEach(b => b.classList.remove("active"));
      document.getElementById("btn-" + hours).classList.add("active");
      if (hours === 0) {
        customStart = null;
        customEnd = null;
      } else {
        const now = new Date();
        const past = new Date(now.getTime() - hours * 3600 * 1000);
        customStart = past.toISOString().slice(0, 19).replace("T", " ");
        customEnd = now.toISOString().slice(0, 19).replace("T", " ");
      }
      fetchAndRender();
    }

    async function fetchAndRender() {
      let url = "/api/data";
      if (customStart && customEnd) {
        url += `?start=${encodeURIComponent(customStart)}&end=${encodeURIComponent(customEnd)}`;
      }
      const res = await fetch(url);
      const data = await res.json();
      if (data.empty) {
        document.getElementById("lastUpdate").textContent = translate("noData");
        return;
      }

      const L = data.latest;
      const resolutionKeys = {
        "1 Min (Original)": "resolutionOriginal",
        "15 Min (Tagesansicht)": "resolutionDay",
        "1 Std (Wochenansicht)": "resolutionWeek",
        "6 Std (Monatsansicht)": "resolutionMonth",
        "1 Tag (Jahresansicht)": "resolutionYear"
      };
      const resolution = translate(resolutionKeys[data.resolution] || "resolutionUnknown");
      document.getElementById("lastUpdate").textContent =
        translate("lastMeasurement").replace("{time}", formatTimestamp(L.zeit));
      document.getElementById("resBadge").textContent =
        translate("resolutionLabel").replace("{value}", resolution);
      document.getElementById("kStatus").textContent = translateStatus(L.status);
      document.getElementById("kSoc").textContent = `${L.soc}% (${L.kapazitaet.toFixed(1)} Ah)`;
      document.getElementById("kVolt").textContent = `${L.spannung.toFixed(2)} V`;
      document.getElementById("kPower").textContent = `${L.strom >= 0 ? "+" : ""}${L.strom.toFixed(2)} A (${L.leistung.toFixed(0)} W)`;
      document.getElementById("kDrift").textContent = `${L.drift.toFixed(0)} mV`;

      let eta = translate("idle");
      if (L.strom < -0.1) {
        eta = translate("remainingEta").replace(
          "{hours}",
          (L.kapazitaet / Math.abs(L.strom)).toFixed(1)
        );
      } else if (L.strom > 0.1) {
        eta = translate("fullEta").replace(
          "{hours}",
          (Math.max(0, 100 - L.kapazitaet) / L.strom).toFixed(1)
        );
      }
      document.getElementById("kEta").textContent = `${L.temp}°C | ${eta}`;

      const t = data.timestamps;

      Plotly.react("chartCap", [{ x: t, y: data.kapazitaet, name: translate("remainingCapacity"), line: { color: "#00e5ff", width: 2 } }], baseLayout(translate("capacityAxis")), plotConfig);
      Plotly.react("chartVolt", [{ x: t, y: data.spannung, name: translate("totalVoltage"), line: { color: "#ffd54f", width: 2 } }], baseLayout(translate("voltageAxis")), plotConfig);
      Plotly.react("chartPower", [{ x: t, y: data.leistung, name: translate("powerSeries"), line: { color: "#ff5252", width: 2 } }], baseLayout(translate("powerAxis")), plotConfig);
      const cellColors = ["#69f0ae", "#40c4ff", "#ea80fc", "#ffab40", "#00e5ff", "#ffd54f"];
      const cellTraces = (data.cells || []).map((cell, index) => ({
        x: t,
        y: cell.values,
        name: `${translate("cell")} ${index + 1}`,
        line: { color: cellColors[index % cellColors.length], width: 1.5 }
      }));
      Plotly.react("chartCells", cellTraces, baseLayout(translate("cellVoltage")), plotConfig);

      // Zoom/Pan-Synchronisation zwischen allen 4 Diagrammen + dynamisches Nachladen
      if (!initialized) {
        initialized = true;
        const ids = ["chartCap", "chartVolt", "chartPower", "chartCells"];
        ids.forEach(id => {
          document.getElementById(id).on("plotly_relayout", (ev) => {
            if (ev["xaxis.autorange"]) {
              setQuickRange(0);
              return;
            }
           if (ev["xaxis.range"] && ev["xaxis.range"].length === 2) {
  customStart = ev["xaxis.range"].at(0).slice(0, 19);
  customEnd = ev["xaxis.range"].at(1).slice(0, 19);
  document.querySelectorAll(".controls button").forEach(b => b.classList.remove("active"));
  fetchAndRender();
}

          });
        });
      }
    }

    async function initializeDashboard() {
      const response = await fetch("/api/settings");
      if (!response.ok) {
        throw new Error(`Could not load dashboard settings: ${response.status}`);
      }
      const settings = await response.json();
      const savedLanguage = localStorage.getItem("bms-dashboard-language");
      const initialLanguage = Object.prototype.hasOwnProperty.call(translations, savedLanguage)
        ? savedLanguage
        : Object.prototype.hasOwnProperty.call(translations, settings.default_language)
          ? settings.default_language
          : "en";

      languageSelect.value = initialLanguage;
      applyLanguage(initialLanguage);
      languageSelect.addEventListener("change", () => {
        localStorage.setItem("bms-dashboard-language", languageSelect.value);
        applyLanguage(languageSelect.value);
        fetchAndRender();
      });

      await fetchAndRender();
      setInterval(fetchAndRender, 10000);
    }

    initializeDashboard();
  </script>
</body>
</html>
